name: 'Setup Firebolt Core'
description: 'Sets up Firebolt Core Docker containers with certificates and waits for service readiness'
inputs:
  tag_version:
    description: 'The docker image tag for the firebolt core'
    required: false
    default: 'preview-rc'
outputs:
  docker_compose_file:
    description: 'Path to the Docker Compose file'
    value: ${{ steps.prepare-compose.outputs.docker_compose_file }}
  service_url:
    description: 'HTTP URL of the running service'
    value: ${{ steps.setup.outputs.service_url }}
  service_https_url:
    description: 'HTTPS URL of the running service'
    value: ${{ steps.setup.outputs.service_https_url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout action repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: firebolt-db/action-setup-core
        path: action-setup-core
        # No later step uses git, so don't leave the token in .git/config.
        persist-credentials: false

    - name: Setup Docker environment
      id: setup
      shell: bash
      env:
        SERVICE_URL: 'http://localhost:3473'
        SERVICE_HTTPS_URL: 'https://localhost:443'
        MAX_RETRIES: '30'
        RETRY_INTERVAL: '2'
        WORKSPACE: ${{ github.workspace }}
      run: |
        # Detect the actual checkout location of the action
        ACTION_DIR="$WORKSPACE/action-setup-core"
        DOCKER_COMPOSE_FILE="$ACTION_DIR/resources/docker-compose.yml"
        {
          echo "action_dir=$ACTION_DIR"
          echo "docker_compose_file=$DOCKER_COMPOSE_FILE"
          echo "service_url=$SERVICE_URL"
          echo "service_https_url=$SERVICE_HTTPS_URL"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Generate certificates
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
      run: |
        mkdir -p "$ACTION_DIR/resources/certs"
        pip install trustme
        # Generate a self-signed certificate for localhost
        python3 -m trustme -d "$ACTION_DIR/resources/certs/"

    - name: Install certificates to keystore
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
      run: |
        sudo cp "$ACTION_DIR/resources/certs/client.pem" /usr/local/share/ca-certificates/client.crt
        sudo update-ca-certificates
    
    - name: Install certificates to java keystore
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
      run: |
        # The JDK may come from a cache (e.g. setup-java cache-jdk) that already
        # holds the alias from a previous run, so replace it with the new cert.
        sudo keytool -delete \
          -keystore "$JAVA_HOME/lib/security/cacerts" \
          -storepass changeit \
          -alias dev-localhost >/dev/null 2>&1 || true
        sudo keytool -importcert \
          -keystore "$JAVA_HOME/lib/security/cacerts" \
          -storepass changeit \
          -file "$ACTION_DIR/resources/certs/client.pem" \
          -alias dev-localhost \
          -noprompt

    - name: Set image tag
      id: set-tag
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.tag_version }}
      run: |
        echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

    - name: Prepare docker-compose.yml
      id: prepare-compose
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
        DOCKER_COMPOSE_FILE: ${{ steps.setup.outputs.docker_compose_file }}
        IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
      run: |
        if [ ! -f "$DOCKER_COMPOSE_FILE" ]; then
          echo "Error: Docker compose file not found at $DOCKER_COMPOSE_FILE"
          exit 1
        fi
        
        # Replace variables in the original file
        sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" "$DOCKER_COMPOSE_FILE"
        sed -i "s|\${BASE_DIR}|$ACTION_DIR|g" "$DOCKER_COMPOSE_FILE"
        
        # Output the prepared file path
        echo "docker_compose_file=$DOCKER_COMPOSE_FILE" >> "$GITHUB_OUTPUT"
        echo "Docker compose file prepared:"
        cat "$DOCKER_COMPOSE_FILE"

    - name: Setup core folders permission
      id: setup-core-permission
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
        IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
      run: |
        WHO="$(docker run --rm --entrypoint whoami "ghcr.io/firebolt-db/firebolt-core:$IMAGE_TAG")"
        # Ensure the host directory that is mounted to /firebolt-core/data exists
        if [ "$WHO" = "firebolt-core" ]; then
          mkdir -p "$ACTION_DIR/firebolt-core"
          sudo chown 1111:1111 "$ACTION_DIR/firebolt-core"
        fi

    - name: Start service containers
      shell: bash
      env:
        DOCKER_COMPOSE_FILE: ${{ steps.prepare-compose.outputs.docker_compose_file }}
      run: |
        docker compose -f "$DOCKER_COMPOSE_FILE" up -d
        docker compose -f "$DOCKER_COMPOSE_FILE" ps

    - name: Wait for service to be ready
      shell: bash
      env:
        MAX_RETRIES: '30'
        RETRY_INTERVAL: '2'
        SERVICE_URL: ${{ steps.setup.outputs.service_url }}
        DOCKER_COMPOSE_FILE: ${{ steps.prepare-compose.outputs.docker_compose_file }}
      run: |
        for i in $(seq 1 "$MAX_RETRIES"); do
          if curl --silent --fail "$SERVICE_URL" --data-binary "SELECT 1" | grep -q "1"; then
            echo "Service is up and responding!"
            exit 0
          fi
          echo "Waiting for service... ($i/$MAX_RETRIES)"
          sleep "$RETRY_INTERVAL"
        done
        echo "Error: Service failed to start within timeout"
        docker compose -f "$DOCKER_COMPOSE_FILE" logs
        exit 1

    - name: Verify https setup with curl
      shell: bash
      env:
        ACTION_DIR: ${{ steps.setup.outputs.action_dir }}
        SERVICE_HTTPS_URL: ${{ steps.setup.outputs.service_https_url }}
      run: |
        curl --cacert "$ACTION_DIR/resources/certs/client.pem" \
          --silent --fail "$SERVICE_HTTPS_URL" --data-binary "SELECT 1"
          
    - name: Spin down containers
      if: always()
      uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e # v1.4.5
      env:
        # The post command runs in a shell with the step's environment.
        DOCKER_COMPOSE_FILE: ${{ steps.prepare-compose.outputs.docker_compose_file }}
      with:
        post: docker compose -f "$DOCKER_COMPOSE_FILE" down